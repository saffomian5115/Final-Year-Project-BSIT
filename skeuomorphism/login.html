<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three login tiles · Skeuo / Neumor / Glass</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #eef0f3;
      background: radial-gradient(circle at 30% 20%, #f5f7fc, #dce1ec);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* main container – three cards + settings */
    .showcase {
      max-width: 1300px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    /* ===== base tile style (each will override) ===== */
    .tile {
      width: 280px;
      padding: 2rem 1.8rem;
      border-radius: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .tile:hover {
      transform: translateY(-6px);
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .sub {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 2rem;
      letter-spacing: 0.3px;
    }

    /* icon / avatar */
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #aaa; /* will be overridden by theme */
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    /* input fields */
    .input-field {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: none;
      border-radius: 3rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      background: transparent;
    }

    .input-field:focus {
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1.1rem;
      margin: 1.2rem 0 1rem;
      cursor: pointer;
      transition: 0.1s;
    }

    .login-btn:active {
      transform: translateY(2px);
    }

    .settings-note {
      margin-top: 1rem;
      font-size: 0.8rem;
    }

    /* ===== SKEUOMORPHISM (realistic depth, shadows, physical) ===== */
    .skeuo-tile {
      background: #eef2f6;
      box-shadow: 
        0.8rem 0.8rem 1.6rem #b0b8c5,
        -0.6rem -0.6rem 1.2rem #ffffff,
        inset 0 1px 2px #ffffff;
      border: 1px solid rgba(255,255,255,0.4);
      color: #1e2a3a;
    }
    .skeuo-tile .avatar {
      background: #d5dce8;
      box-shadow: 
        0.4rem 0.4rem 0.8rem #b0b8c5,
        -0.3rem -0.3rem 0.6rem #ffffff,
        inset 0 1px 2px #ffffff;
      color: #2c3e50;
    }
    .skeuo-tile .input-field {
      background: #eef2f6;
      box-shadow: 
        inset 0.3rem 0.3rem 0.7rem #b0b8c5,
        inset -0.2rem -0.2rem 0.5rem #ffffff;
      color: #000;
    }
    .skeuo-tile .input-field::placeholder {
      color: #4a5568;
    }
    .skeuo-tile .login-btn {
      background: #eef2f6;
      box-shadow: 
        0.5rem 0.5rem 1rem #b0b8c5,
        -0.3rem -0.3rem 0.8rem #ffffff;
      color: #1e2a3a;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .skeuo-tile .login-btn:active {
      box-shadow: 
        inset 0.4rem 0.4rem 0.8rem #b0b8c5,
        inset -0.2rem -0.2rem 0.6rem #ffffff;
    }

    
    /* responsive */
    @media (max-width: 700px) {
      .tile, .settings-tile { width: 260px; }
    }
  </style>
</head>
<body>
  <div class="showcase">
    <!-- SKEUOMORPHISM TILE -->
    <div class="tile skeuo-tile">
      <h2>skeuo·login</h2>
      <div class="sub">realistic depth · physical</div>
      <div class="avatar">👤</div>
      <input class="input-field" type="text" placeholder="username" value="alex">
      <input class="input-field" type="password" placeholder="password" value="123456">
      <button class="login-btn">sign in</button>
      <div class="settings-note">🔒 extruded shadows</div>
    </div>

    

   
  <script>
    // optional: add slight haptic simulation
    document.querySelectorAll('.login-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();  // just for demo – no form submit
        this.style.transform = 'translateY(3px)';
        setTimeout(() => this.style.transform = '', 120);
      });
    });
  </script>
  <!-- extra note to match image text "Settings" -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .settings-tile .note {
      color: #1e293b;
    }
  </style>
</body>
</html>
